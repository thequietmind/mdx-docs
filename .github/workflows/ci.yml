name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test

  # Single stable check for the branch ruleset to require, so the test job can
  # change shape (it used to be a matrix over MUI majors, and the 1.x branch
  # still is) without editing repo settings.
  # `if: always()` is load-bearing: without it this job is skipped when the test
  # job fails, the required check never reports, and the PR blocks forever
  # instead of failing.
  lint-and-test:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check test result
        run: |
          echo "test job result: ${{ needs.test.result }}"
          [ "${{ needs.test.result }}" = "success" ] || exit 1
