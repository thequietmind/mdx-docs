# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Only rewrite a range in package.json when the new version falls outside
    # it; otherwise update the lockfile alone. peerDependencies are the published
    # contract -- they state the minimum version that works, not the newest one
    # tested -- and the default strategy kept raising those floors on in-range
    # patch bumps, narrowing what consumers could install for no reason.
    versioning-strategy: increase-if-necessary
    # Group packages that must move in lockstep so a partial bump can't leave
    # the versions out of sync (which breaks the lockfile, or fails at runtime
    # -- react refuses to start when react and react-dom disagree).
    groups:
      vite-vitest:
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      mui:
        patterns:
          - "@mui/*"
          - "@emotion/*"
      testing-library:
        patterns:
          - "@testing-library/*"
